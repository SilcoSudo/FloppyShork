name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v2

      - name: Thiết lập môi trường
        run: sudo apt update && sudo apt install -y python3

      - name: Chạy kiểm tra
        run: echo "Kiểm tra mã nguồn thành công!"

      - name: Hoàn tất
        run: echo "Pipeline CI chạy thành công!"
